<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preload" as="image" href="/logo-main.png" />
    <title>Учетные записи</title>
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(900px 460px at 20% 0%, rgba(74, 124, 89, 0.10), transparent 60%),
          radial-gradient(900px 460px at 100% 10%, rgba(92, 110, 97, 0.10), transparent 55%),
          #ffffff;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #preloader.loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #preloader img {
        max-width: 140px;
        max-height: 140px;
        object-fit: contain;
        opacity: 0.9;
        animation: preloader-pulse 1.1s ease-in-out infinite;
        filter: drop-shadow(0 18px 40px rgba(16, 24, 40, 0.16));
      }
      @keyframes preloader-pulse {
        0%, 100% { transform: translateY(0); opacity: 0.92; }
        50% { transform: translateY(-2px); opacity: 0.72; }
      }
    </style>
  </head>
  <body>
    <div id="preloader" aria-hidden="true">
      <img src="/logo-main.png" alt="" width="140" height="140" />
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
